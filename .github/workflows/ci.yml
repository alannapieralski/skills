name: CI

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/**'
      - 'skills/**'
  pull_request:
    paths:
      - '.claude-plugin/**'
      - 'skills/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate marketplace manifest
        run: npx -y @anthropic-ai/claude-code@latest plugin validate .
